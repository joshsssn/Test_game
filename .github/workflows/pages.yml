name: Tests et publication

on:
  push:
    branches: [main, claude/laser-game-two-player-dxvxq8]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tests:
    name: Tests du moteur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/moteur.test.mjs

  publication:
    name: Publication sur GitHub Pages
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GitHub Pages sert la branche gh-pages, qui n'est qu'un miroir de celle-ci :
      # le site est statique et vit à la racine du dépôt.
      - name: Mettre gh-pages à jour
        run: git push origin HEAD:gh-pages --force
